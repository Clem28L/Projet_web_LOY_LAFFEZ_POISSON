<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mon RDV - Département Informatique</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-gauche">
            <img src="/data/logo.png" alt="Logo" height="40">
            <span id="header-titre">Département Informatique</span>
        </div>
        <nav>
            <a href="accueuil.html">Accueil</a>
            <a href="formations.html">Formations</a>
            <a href="equipe.html">Équipe</a>
            <a href="rdv.html">RDV</a>
            <a href="permanences.html">Permanences</a>
        </nav>
    </header>

    <main>
        <section id="section-rdv">
            <h2>Prendre un Rendez-vous</h2>

            <div class="conteneur-rdv">
                <div class="zone-formulaire">
                    <form id="form-rdv" onsubmit="return false">
                        <fieldset>
                            <label>Nom : <input type="text" id="nom"></label>
                            <label>Prénom : <input type="text" id="prenom"></label>
                            <label>Promo : <input type="text" id="promo"></label>
                            <label>Date : <input type="date" id="date-rdv"></label>
                            <label>Heure :
                                <select id="heure-rdv">
                                    <option value="">-- Choisir --</option>
                                    <option value="08:00">08:00</option>
                                    <option value="09:00">09:00</option>
                                    <option value="10:00">10:00</option>
                                    <option value="11:00">11:00</option>
                                    <option value="14:00">14:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="16:00">16:00</option>
                                    <option value="17:00">17:00</option>
                                </select>
                            </label>
                            <label>Demande particulière : <input type="text" id="demande"></label>
                            <input type="button" value="Prendre RDV" class="btn-valider" onclick="validerRDV()">
                        </fieldset>
                    </form>
                </div>

                <div class="zone-calendrier">
                    <div class="navigation-semaine">
                        <button class="btn-nav" onclick="changerSemaineRDV(-7)">◄ Précédent</button>
                        <h3 id="titre-semaine-rdv">Semaine en cours</h3>
                        <button class="btn-nav" onclick="changerSemaineRDV(7)">Suivant ►</button>
                    </div>

                    <div class="calendrier-container">
                        <table id="emploi-du-temps">
                            <thead>
                                <tr id="entete-jours-rdv">
                                    <th>Heure</th>
                                    <th>Lundi</th>
                                    <th>Mardi</th>
                                    <th>Mercredi</th>
                                    <th>Jeudi</th>
                                    <th>Vendredi</th>
                                </tr>
                            </thead>
                            <tbody id="corps-calendrier-rdv">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Département Informatique — EFREI Paris</p>
        <a href="https://www.efrei.fr">
            <img src="/data/Logo-Efrei-Blanc.png" alt="Logo EFREI" height="36">
        </a>
        <div class="footer-liens">
            <a href="a-propos.html">À propos</a>
            <a href="login.html">Admin</a>
        </div>
    </footer>

    <div class="chat-toggle" onclick="toggleChat()">💬</div>
    <div class="chatbox" id="chatbox">
        <div class="chat-header">
            Chatbot EFREI
            <span onclick="toggleChat()" class="close-btn">✖</span>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Écrire un message...">
            <button id="btn-envoyer-chat" onclick="lireFichierJSONEtRepondre('intents.json')">Envoyer</button>
        </div>
    </div>

    <script src="scriptrdv.js"></script>
    <script src="chatbot.js"></script>
</body>

</html>
