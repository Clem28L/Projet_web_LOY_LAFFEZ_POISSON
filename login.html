<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connexion Admin - Département Informatique</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <div class="header-gauche">
            <a href="accueuil.html">
                <img src="/data/logo.png" alt="Logo" height="40">
            </a>
            <span id="header-titre">Département Informatique</span>
        </div>
        <nav>
            <a href="accueuil.html">Accueil</a>
            <a href="equipe.html">Équipe</a>
            <a href="rdv.html">RDV</a>
            <a href="permanences.html">Permanences</a>
            <a href="quiz.html">Quiz</a>
        </nav>
    </header>

    <main>
        <section id="section-login">
            <h2>Espace Admin - Connexion</h2>
            <div class="boite-login">
                <form id="form-login" onsubmit="return false">
                    <fieldset>
                        <label>Identifiant : <input type="text" id="username"></label>
                        <label>Mot de passe : <input type="password" id="password"></label>
                        <input type="button" value="Se connecter" id="btn-valider" onclick="verifierLogin()">
                    </fieldset>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Département Informatique — EFREI Paris</p>
        <a href="https://www.efrei.fr">
            <img src="/data/Logo-Efrei-Blanc.png" alt="Logo EFREI" height="36">
        </a>
        <div class="footer-liens">
            <a href="a-propos.html">À propos</a>
            <a href="login.html">Admin</a>
        </div>
    </footer>

    <script src="scriptper.js"></script>
    <div class="chat-toggle" onclick="toggleChat()">
        💬
    </div>

    <div class="chatbox" id="chatbox">
        <div class="chat-header">
            Chatbot EFREI
            <span onclick="toggleChat()" class="close-btn">✖</span>
        </div>
        <div class="chat-body" id="chat-body">
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Écrire un message...">
            <button id="btn-envoyer-chat" onclick="fetchJSON('intents.json')">Envoyer</button>
        </div>
    </div>
    <script src="chatbot.js"></script>
</body>

</html>
